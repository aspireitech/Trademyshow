# Sandbox deployment: one command, no external services.
#
#   docker compose up --build
#   docker compose exec app node -e "require('child_process')..."  # see DEPLOY.md
#
# Everything external is stubbed: no market-data licence, no Stripe account,
# no mail provider. Swap the placeholders below for real credentials to move
# this from a sandbox to a staging environment.

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      SANDBOX: "true"
      SITE_URL: "http://localhost:3000"
      # Generate a real one for anything beyond a local sandbox:
      #   openssl rand -hex 32
      AUTH_SECRET: "sandbox-only-secret-do-not-use-in-production"
      CRON_SECRET: "sandbox-cron-secret"
      MARKET_DATA_PROVIDER: "mock"
      LEGAL_COMPANY_NAME: "TradeMyShow Sandbox Ltd"
      LEGAL_COMPANY_NUMBER: "SANDBOX-0000"
      LEGAL_ADDRESS: "1 Example Street, Sandbox"
      LEGAL_GOVERNING_LAW: "England and Wales"
      LEGAL_FORUM: "London"
      LEGAL_CONTACT_EMAIL: "legal@example.com"
    volumes:
      - tms-data:/data
    restart: unless-stopped

volumes:
  tms-data:
